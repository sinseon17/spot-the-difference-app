name: Build Android App (APK + AAB)

# GitHub에 푸시하면 클라우드에서 안드로이드 앱을 자동으로 빌드합니다.
#  · app-debug.apk   : 폰에 바로 설치해 보는 테스트용 (디버그 서명)
#  · app-release.apk : 배포용 릴리스 서명 APK
#  · app-release.aab : Google Play 스토어 업로드용 번들
# 빌드 결과는 Actions 실행 화면 아래 "Artifacts"에서 내려받습니다.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '_review/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Copy web app into www/
        run: npm run cap:copy

      - name: Add Capacitor Android platform
        run: npx cap add android

      - name: Sync web app into the Android project
        run: npm run cap:sync

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          KS="$GITHUB_WORKSPACE/android/app/spotdiff-release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "저장소 시크릿(ANDROID_KEYSTORE_BASE64)의 키스토어를 사용합니다."
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KS"
          else
            echo "키스토어 시크릿이 없어 임시 키스토어를 만듭니다 (테스트 설치용)."
            keytool -genkeypair -v -keystore "$KS" \
              -alias "${KEY_ALIAS:-spotdiff}" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${STORE_PASSWORD:-spotdiff123}" \
              -keypass "${KEY_PASSWORD:-spotdiff123}" \
              -dname "CN=Spot the Difference, O=SpotDiff, C=KR" > /dev/null
          fi
          {
            echo "SPOTDIFF_KEYSTORE=$KS"
            echo "SPOTDIFF_STORE_PASSWORD=${STORE_PASSWORD:-spotdiff123}"
            echo "SPOTDIFF_KEY_ALIAS=${KEY_ALIAS:-spotdiff}"
            echo "SPOTDIFF_KEY_PASSWORD=${KEY_PASSWORD:-spotdiff123}"
          } >> "$GITHUB_ENV"

      - name: Attach release signing config to Gradle
        run: python3 scripts/patch_android_signing.py

      - name: Build APK and AAB
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect build outputs
        run: |
          set -e
          mkdir -p out
          APK=android/app/build/outputs/apk
          BUNDLE=android/app/build/outputs/bundle/release
          [ -f "$APK/debug/app-debug.apk" ] && cp "$APK/debug/app-debug.apk" out/spot-difference-debug.apk
          [ -f "$APK/release/app-release.apk" ] && cp "$APK/release/app-release.apk" out/spot-difference-release.apk
          [ -f "$BUNDLE/app-release.aab" ] && cp "$BUNDLE/app-release.aab" out/spot-difference-release.aab
          ls -lh out
          {
            echo "### 빌드 완료 🎉"
            echo ""
            echo "| 파일 | 크기 |"
            echo "| --- | --- |"
            for f in out/*; do echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spot-the-difference-android
          path: out/*
          if-no-files-found: error
          retention-days: 30
